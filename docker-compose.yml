services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: repobeacon-postgres
    environment:
      POSTGRES_DB: repobeacon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5442:5432"
    volumes:
      - repobeacon_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d repobeacon"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  repobeacon_pg_data:
